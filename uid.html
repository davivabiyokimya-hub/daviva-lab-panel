<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DAVIVA LAB - Firebase UID</title><style>body{font:16px system-ui;background:#102b48;color:#18334b;display:grid;place-items:center;min-height:100vh;margin:0}.card{background:white;padding:28px;border-radius:16px;max-width:560px;width:90%;box-sizing:border-box}button{background:#147fae;color:white;border:0;border-radius:8px;padding:12px 18px;cursor:pointer;margin:6px 0}code{display:block;overflow-wrap:anywhere;background:#e8f4fa;padding:12px;border-radius:8px}p{line-height:1.5}</style></head><body><main class="card"><h1>DAVIVA LAB · Kullanıcı UID</h1><p>Bu sayfa yalnızca Google hesabınızın Firebase UID bilgisini gösterir. Uygulama erişim yetkisi vermez.</p><button id="login">Google ile Giriş Yap</button><p id="status">Giriş bekleniyor.</p><section id="details" hidden><p id="email"></p><strong>Firebase Authentication UID</strong><code id="uid"></code><button id="copy">UID Kopyala</button></section></main><script type="module">import{initializeApp}from"https://www.gstatic.com/firebasejs/11.10.0/firebase-app.js";import{getAuth,GoogleAuthProvider,signInWithPopup,onAuthStateChanged}from"https://www.gstatic.com/firebasejs/11.10.0/firebase-auth.js";import{firebaseConfig}from"./daviva-firebase-config.js?v=20261016-2";const auth=getAuth(initializeApp(firebaseConfig));const status=document.getElementById("status"),details=document.getElementById("details"),uid=document.getElementById("uid"),email=document.getElementById("email");onAuthStateChanged(auth,u=>{details.hidden=!u;status.textContent=u?"Google kimlik doğrulaması başarılı.":"Google hesabınızla giriş yapın.";if(u){uid.textContent=u.uid;email.textContent="Hesap: "+(u.email||"—")}},e=>{status.textContent="Kimlik doğrulama hatası: "+e.message});document.getElementById("login").onclick=async()=>{try{await signInWithPopup(auth,new GoogleAuthProvider())}catch(e){status.textContent="Giriş hatası: "+e.message}};document.getElementById("copy").onclick=async()=>{try{await navigator.clipboard.writeText(uid.textContent);status.textContent="UID kopyalandı."}catch(e){status.textContent="UID metnini seçip kopyalayın."}};</script></body></html>
